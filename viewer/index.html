    // ================================================================
    // Delete Folder
    // ================================================================
    async function deleteFolder(folderId, folderName) {
        if (!treeConfig) return;
        function findFolder(folders, parentFolders) {
            for (let i = 0; i < folders.length; i++) {
                if (folders[i].id === folderId) return { folder: folders[i], parent: folders, index: i, parentFolders };
                if (folders[i].children) {
                    const found = findFolder(folders[i].children, folders[i]);
                    if (found) return found;
                }
            }
            return null;
        }
        function countContents(folder) {
            let count = (folder.files || []).length;
            if (folder.children) folder.children.forEach(c => { count += countContents(c); });
            return count;
        }

        const config = JSON.parse(JSON.stringify(treeConfig));
        const found = findFolder(config.folders, null);
        if (!found) { showToast('Folder not found'); return; }

        const fileCount = countContents(found.folder);
        if (fileCount > 0) {
            const parentName = found.parentFolders ? found.parentFolders.name : 'root';
            if (!confirm(`"${folderName}" contains ${fileCount} files. Files will be moved to parent (${parentName}). Continue?`)) return;
            function collectFiles(folder) {
                let files = [...(folder.files || [])];
                if (folder.children) folder.children.forEach(c => { files = files.concat(collectFiles(c)); });
                return files;
            }
            const allFiles = collectFiles(found.folder);
            if (found.parentFolders && found.parentFolders.files) {
                found.parentFolders.files = found.parentFolders.files.concat(allFiles);
            } else if (found.parentFolders) {
                found.parentFolders.files = allFiles;
            } else {
                if (config.folders.length > 1) {
                    const target = config.folders.find(f => f.id !== folderId);
                    if (target) { target.files = (target.files || []).concat(allFiles); }
                }
            }
        } else {
            if (!confirm(`Delete empty folder "${folderName}"?`)) return;
        }

        found.parent.splice(found.index, 1);

        try {
            const res = await fetch(API_BASE + '/tree-config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ config, user: 'anonymous' })
            });
            const result = await res.json();
            if (result.success) {
                treeConfig = config;
                treeConfig.version = result.version;
                renderTree(treeConfig);
                showToast(`Deleted folder "${folderName}"`);
            } else {
                showToast('Delete failed', 'error');
            }
        } catch { showToast('Network error', 'error'); }
    }

    // ================================================================
    // Drag & Drop: move file between folders
    // ================================================================
    function moveFileInTree(filePath, sourceFolderId, targetFolderId) {
        if (!treeConfig || sourceFolderId === targetFolderId) return;
        const config = JSON.parse(JSON.stringify(treeConfig));
        function removeFile(folders) {
            for (const f of folders) {
                if (f.id === sourceFolderId && f.files) {
                    const idx = f.files.indexOf(filePath);
                    if (idx !== -1) { f.files.splice(idx, 1); return true; }
                }
                if (f.children && removeFile(f.children)) return true;
            }
            return false;
        }
        function addFile(folders) {
            for (const f of folders) {
                if (f.id === targetFolderId) { if (!f.files) f.files = []; f.files.push(filePath); return true; }
                if (f.children && addFile(f.children)) return true;
            }
            return false;
        }
        removeFile(config.folders);
        addFile(config.folders);
        localStorage.setItem('tree:' + targetFolderId, 'open');
        saveTreeConfig(config, 'Moved to target folder');
    }

    // ================================================================
    // Move folder in tree
    // ================================================================
    function moveFolderInTree(folderId, targetFolderId) {
        if (!treeConfig || folderId === targetFolderId) return;
        const config = JSON.parse(JSON.stringify(treeConfig));
        function isDescendant(folders, ancestorId, childId) {
            for (const f of folders) {
                if (f.id === ancestorId) {
                    if (f.children) {
                        for (const c of f.children) {
                            if (c.id === childId) return true;
                            if (isDescendant([c], c.id, childId)) return true;
                        }
                    }
                    return false;
                }
                if (f.children && isDescendant(f.children, ancestorId, childId)) return true;
            }
            return false;
        }
        if (isDescendant(config.folders, folderId, targetFolderId)) {
            showToast('Cannot move into its own subfolder');
            return;
        }
        let removedFolder = null;
        function removeFolder(folders) {
            for (let i = 0; i < folders.length; i++) {
                if (folders[i].id === folderId) { removedFolder = folders.splice(i, 1)[0]; return true; }
                if (folders[i].children && removeFolder(folders[i].children)) return true;
            }
            return false;
        }
        function addFolder(folders) {
            for (const f of folders) {
                if (f.id === targetFolderId) { if (!f.children) f.children = []; f.children.push(removedFolder); return true; }
                if (f.children && addFolder(f.children)) return true;
            }
            return false;
        }
        removeFolder(config.folders);
        if (!removedFolder) return;
        if (targetFolderId === '_root') { config.folders.push(removedFolder); }
        else if (!addFolder(config.folders)) { config.folders.push(removedFolder); }
        if (targetFolderId !== '_root') localStorage.setItem('tree:' + targetFolderId, 'open');
        saveTreeConfig(config, 'Folder moved');
    }

    // ================================================================
    // Reorder file within/across folders
    // ================================================================
    function reorderFileInTree(filePath, sourceFolderId, targetFolderId, targetFilePath, position) {
        if (!treeConfig) return;
        const config = JSON.parse(JSON.stringify(treeConfig));
        function removeFile(folders) {
            for (const f of folders) {
                if (f.id === sourceFolderId && f.files) {
                    const idx = f.files.indexOf(filePath);
                    if (idx !== -1) { f.files.splice(idx, 1); return true; }
                }
                if (f.children && removeFile(f.children)) return true;
            }
            return false;
        }
        function insertFile(folders) {
            for (const f of folders) {
                if (f.id === targetFolderId && f.files) {
                    const targetIdx = f.files.indexOf(targetFilePath);
                    if (targetIdx !== -1) {
                        f.files.splice(position === 'before' ? targetIdx : targetIdx + 1, 0, filePath);
                        return true;
                    }
                }
                if (f.children && insertFile(f.children)) return true;
            }
            return false;
        }
        removeFile(config.folders);
        if (!insertFile(config.folders)) return;
        if (sourceFolderId !== targetFolderId) localStorage.setItem('tree:' + targetFolderId, 'open');
        saveTreeConfig(config, sourceFolderId === targetFolderId ? 'Reordered' : 'Moved to target');
    }

    // ================================================================
    // Reorder folder (sibling position)
    // ================================================================
    function reorderFolderInTree(folderId, targetFolderId, position) {
        if (!treeConfig || folderId === targetFolderId) return;
        const config = JSON.parse(JSON.stringify(treeConfig));
        function isDescendant(folders, ancestorId, childId) {
            for (const f of folders) {
                if (f.id === ancestorId) {
                    if (f.children) {
                        for (const c of f.children) {
                            if (c.id === childId) return true;
                            if (isDescendant([c], c.id, childId)) return true;
                        }
                    }
                    return false;
                }
                if (f.children && isDescendant(f.children, ancestorId, childId)) return true;
            }
            return false;
        }
        if (isDescendant(config.folders, folderId, targetFolderId)) {
            showToast('Cannot reorder next to own subfolder');
            return;
        }
        let removedFolder = null;
        function removeFolder(folders) {
            for (let i = 0; i < folders.length; i++) {
                if (folders[i].id === folderId) { removedFolder = folders.splice(i, 1)[0]; return true; }
                if (folders[i].children && removeFolder(folders[i].children)) return true;
            }
            return false;
        }
        function insertAtTarget(folders) {
            for (let i = 0; i < folders.length; i++) {
                if (folders[i].id === targetFolderId) {
                    folders.splice(position === 'before' ? i : i + 1, 0, removedFolder);
                    return true;
                }
                if (folders[i].children && insertAtTarget(folders[i].children)) return true;
            }
            return false;
        }
        removeFolder(config.folders);
        if (!removedFolder) return;
        if (!insertAtTarget(config.folders)) config.folders.push(removedFolder);
        saveTreeConfig(config, 'Folder reordered');
    }

    // ================================================================
    // Save tree config (shared helper)
    // ================================================================
    function saveTreeConfig(config, successMsg) {
        fetch(API_BASE + '/tree-config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ config, user: 'anonymous' })
        }).then(r => r.json()).then(result => {
            if (result.success) {
                treeConfig = config;
                treeConfig.version = result.version;
                renderTree(treeConfig);
                showToast(successMsg || 'Saved');
            } else {
                showToast('Save failed', 'error');
            }
        }).catch(() => showToast('Network error', 'error'));
    }

    // ================================================================
    // Create Folder
    // ================================================================
    const createFolderModal = document.getElementById('createFolderModal');
    const newFolderName = document.getElementById('newFolderName');
    const newFolderParent = document.getElementById('newFolderParent');

    function populateFolderSelect(selectEl) {
        const opts = ['<option value="">Root</option>'];
        function walk(folders, depth) {
            for (const f of folders) {
                const indent = '\u2014'.repeat(depth);
                opts.push(`<option value="${f.id}">${indent}${indent ? ' ' : ''}${f.name}</option>`);
                if (f.children) walk(f.children, depth + 1);
            }
        }
        if (treeConfig) walk(treeConfig.folders, 0);
        selectEl.innerHTML = opts.join('');
    }

    document.getElementById('createFolderCancel').addEventListener('click', () => { createFolderModal.style.display = 'none'; });
    createFolderModal.addEventListener('click', (e) => { if (e.target === createFolderModal) createFolderModal.style.display = 'none'; });

    document.getElementById('createFolderCreate').addEventListener('click', async () => {
        const name = newFolderName.value.trim();
        if (!name) { showToast('Please enter a folder name'); return; }
        const parentId = newFolderParent.value || null;
        try {
            const res = await fetch(API_BASE + '/create-folder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, parentFolderId: parentId })
            });
            const result = await res.json();
            if (result.success) {
                createFolderModal.style.display = 'none';
                if (result.folderId) localStorage.setItem('tree:' + result.folderId, 'open');
                if (parentId) localStorage.setItem('tree:' + parentId, 'open');
                showToast('Folder "' + name + '" created');
                await loadFileList();
            } else {
                showToast(result.error || 'Creation failed', 'error');
            }
        } catch { showToast('Network error', 'error'); }
    });

    newFolderName.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('createFolderCreate').click();
    });

    // ================================================================
    // Batch Mode
    // ================================================================
    let batchModeActive = false;

    document.getElementById('tbBatchMode').addEventListener('click', () => {
        batchModeActive = !batchModeActive;
        sidebar.classList.toggle('batch-mode', batchModeActive);
        document.getElementById('batchToolbar').classList.toggle('visible', batchModeActive);
        if (batchModeActive) populateBatchMoveTargets();
        else fileList.querySelectorAll('.batch-checkbox').forEach(cb => cb.checked = false);
        updateBatchCount();
    });

    function updateBatchCount() {
        const count = fileList.querySelectorAll('.batch-checkbox:checked').length;
        document.getElementById('batchCount').textContent = count + ' selected';
    }

    function populateBatchMoveTargets() {
        const sel = document.getElementById('batchMoveTarget');
        sel.innerHTML = '<option value="">Move to...</option>';
        if (!treeConfig) return;
        function addOptions(folders, prefix) {
            for (const f of folders) {
                const opt = document.createElement('option');
                opt.value = f.id;
                opt.textContent = prefix + f.name;
                sel.appendChild(opt);
                if (f.children) addOptions(f.children, prefix + '\u00A0\u00A0');
            }
        }
        addOptions(treeConfig.folders, '');
    }

    function getSelectedFiles() {
        const files = [];
        fileList.querySelectorAll('.batch-checkbox:checked').forEach(cb => {
            const item = cb.closest('.sidebar-item');
            if (item) files.push({ path: item.dataset.path, folderId: item.dataset.folderId });
        });
        return files;
    }

    document.getElementById('batchSelectAll').addEventListener('click', () => {
        const cbs = fileList.querySelectorAll('.batch-checkbox');
        const allChecked = Array.from(cbs).every(cb => cb.checked);
        cbs.forEach(cb => cb.checked = !allChecked);
        updateBatchCount();
    });

    document.getElementById('batchMove').addEventListener('click', async () => {
        const target = document.getElementById('batchMoveTarget').value;
        if (!target) { showToast('Please select a target folder'); return; }
        const files = getSelectedFiles();
        if (!files.length) { showToast('Please select files first'); return; }

        const config = JSON.parse(JSON.stringify(treeConfig));
        function removeFromAll(folders) {
            for (const f of folders) {
                if (f.files) f.files = f.files.filter(fp => !files.some(s => s.path === fp));
                if (f.children) removeFromAll(f.children);
            }
        }
        function addToTarget(folders) {
            for (const f of folders) {
                if (f.id === target) { if (!f.files) f.files = []; files.forEach(s => f.files.push(s.path)); return true; }
                if (f.children && addToTarget(f.children)) return true;
            }
            return false;
        }
        removeFromAll(config.folders);
        addToTarget(config.folders);

        try {
            const res = await fetch(API_BASE + '/tree-config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ config, user: 'anonymous' })
            });
            const result = await res.json();
            if (result.success) {
                treeConfig = config;
                treeConfig.version = result.version;
                batchModeActive = false;
                sidebar.classList.remove('batch-mode');
                document.getElementById('batchToolbar').classList.remove('visible');
                renderTree(treeConfig);
                showToast('Moved ' + files.length + ' files');
            }
        } catch { showToast('Network error', 'error'); }
    });

    document.getElementById('batchRemove').addEventListener('click', async () => {
        const files = getSelectedFiles();
        if (!files.length) { showToast('Please select files first'); return; }
        const config = JSON.parse(JSON.stringify(treeConfig));
        function removeFromAll(folders) {
            for (const f of folders) {
                if (f.files) f.files = f.files.filter(fp => !files.some(s => s.path === fp));
                if (f.children) removeFromAll(f.children);
            }
        }
        removeFromAll(config.folders);
        try {
            const res = await fetch(API_BASE + '/tree-config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ config, user: 'anonymous' })
            });
            const result = await res.json();
            if (result.success) {
                treeConfig = config;
                treeConfig.version = result.version;
                batchModeActive = false;
                sidebar.classList.remove('batch-mode');
                document.getElementById('batchToolbar').classList.remove('visible');
                renderTree(treeConfig);
                showToast('Removed ' + files.length + ' files from tree');
            }
        } catch { showToast('Network error', 'error'); }
    });

    document.getElementById('batchCancel').addEventListener('click', () => {
        batchModeActive = false;
        sidebar.classList.remove('batch-mode');
        document.getElementById('batchToolbar').classList.remove('visible');
        fileList.querySelectorAll('.batch-checkbox').forEach(cb => cb.checked = false);
        updateBatchCount();
    });

    // ================================================================
    // Init: detect file from URL
    // ================================================================
    const urlParams = new URLSearchParams(window.location.search);
    let file = urlParams.get('file');
    if (!file) {
        const path = window.location.pathname;
        if (path.endsWith('.md')) file = path.startsWith('/') ? path.substring(1) : path;
    }

    // Handle browser back/forward
    window.addEventListener('popstate', () => {
        const p = window.location.pathname;
        if (p.endsWith('.md')) {
            const f = p.startsWith('/') ? p.substring(1) : p;
            currentDocId = f;
            loadDocument(null, true);
            loadVersions();
            fileList.querySelectorAll('.sidebar-item').forEach(el => el.classList.toggle('active', el.dataset.path === f));
        } else {
            currentDocId = '';
            contentEl.innerHTML = '<div class="loading">Select a document from the sidebar</div>';
            topbar.style.display = 'none';
            tocSidebar.classList.remove('visible');
            tocExpandBtn.style.display = 'none';
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
        }
    });

    // ================================================================
    // Boot
    // ================================================================
    loadFileList().then(() => {
        if (file) {
            currentDocId = file;
            loadDocument(null);
            loadVersions();
            setTimeout(() => {
                fileList.querySelectorAll('.sidebar-item').forEach(el => {
                    if (el.dataset.path === file) {
                        el.classList.add('active');
                        let parent = el.closest('.tree-folder');
                        while (parent) {
                            parent.classList.remove('collapsed');
                            const fid = parent.dataset.folderId;
                            if (fid) localStorage.setItem('tree:' + fid, 'open');
                            parent = parent.parentElement?.closest('.tree-folder');
                        }
                        el.scrollIntoView({ block: 'center' });
                    } else {
                        el.classList.remove('active');
                    }
                });
            }, 500);
        }
    });

    </script>

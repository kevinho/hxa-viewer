<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>HxA Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js" integrity="sha384-vdScihEZCfbPnBQf+lc7LgXUdJVYyhC3yWHUW5C5P5GpHRqVnaM6HJELJxT6IqwM" crossorigin="anonymous"></script>
    <style>
        /* ============================================================
           HxA Viewer — Styles
           ============================================================ */

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 260px;
            min-width: 180px;
            max-width: 500px;
            background: #010409;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: visible;
            position: relative;
            flex-shrink: 0;
        }
        .sidebar.collapsed {
            width: 0 !important;
            min-width: 0 !important;
            border-right: none;
        }
        .sidebar.collapsed .sidebar-header,
        .sidebar.collapsed .sidebar-content,
        .sidebar.collapsed .sidebar-toolbar {
            display: none;
        }

        /* Sidebar resize handle */
        .sidebar-resize {
            position: absolute;
            top: 0;
            right: -3px;
            width: 6px;
            height: 100%;
            cursor: col-resize;
            z-index: 161;
        }
        .sidebar-resize:hover,
        .sidebar-resize.active {
            background: #8957e5;
        }
        .sidebar.collapsed .sidebar-resize { display: none; }

        .sidebar-collapse-btn {
            position: absolute;
            top: 12px;
            right: -24px;
            width: 24px;
            height: 24px;
            background: #21262d;
            border: 1px solid #30363d;
            border-left: none;
            border-radius: 0 4px 4px 0;
            color: #8b949e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 160;
            transition: background 0.15s;
        }
        .sidebar-collapse-btn:hover { background: #30363d; color: #e6edf3; }
        .sidebar.collapsed .sidebar-collapse-btn {
            position: fixed;
            left: 0;
            top: 12px;
            right: auto;
            z-index: 200;
            border-left: 1px solid #30363d;
            border-radius: 0 4px 4px 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #30363d;
        }
        .sidebar-brand {
            font-size: 16px;
            font-weight: 600;
            color: #58a6ff;
            text-decoration: none;
            cursor: pointer;
        }

        /* --- Sidebar search --- */
        .sidebar-search {
            margin-top: 12px;
        }
        .sidebar-search input {
            width: 100%;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 13px;
        }
        .sidebar-search input:focus {
            outline: none;
            border-color: #8957e5;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .sidebar-section {
            padding: 0 8px;
            margin-bottom: 4px;
        }
        .sidebar-section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: #8b949e;
            padding: 8px 4px 4px;
            letter-spacing: 0.5px;
        }

        /* --- Tree folder --- */
        .tree-folder {
            margin-bottom: 2px;
        }
        .tree-folder-header {
            display: flex;
            align-items: center;
            padding: 5px 8px;
            color: #e6edf3;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            user-select: none;
            position: relative;
            gap: 4px;
        }
        @media (hover: hover) { .tree-folder-header:hover { background: #21262d; } }
        .tree-folder-arrow {
            font-size: 10px;
            color: #8b949e;
            width: 16px;
            text-align: center;
            transition: transform 0.15s;
            flex-shrink: 0;
        }
        .tree-folder.collapsed .tree-folder-arrow { transform: rotate(-90deg); }
        .tree-folder.collapsed .tree-folder-children { display: none; }
        .tree-folder-icon { font-size: 14px; flex-shrink: 0; }
        .tree-folder-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tree-folder-count { font-size: 11px; color: #484f58; margin-left: 4px; }

        /* Folder hover actions */
        .tree-folder-actions {
            display: none;
            align-items: center;
            gap: 2px;
            margin-left: auto;
            flex-shrink: 0;
        }
        @media (hover: hover) {
            .tree-folder-header:hover .tree-folder-actions { display: flex; }
            .tree-folder-header:hover .tree-folder-count { display: none; }
        }

        /* Folder more dropdown menu */
        .folder-more-menu {
            position: absolute; right: 0; top: 100%; min-width: 140px;
            background: #161b22; border: 1px solid #30363d; border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4); z-index: 500; padding: 4px 0;
            display: none;
        }
        .folder-more-menu.visible { display: block; }
        .folder-more-menu-item {
            padding: 6px 12px; font-size: 12px; color: #e6edf3; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
        }
        .folder-more-menu-item:hover { background: #21262d; }

        .tree-action-btn {
            width: 22px;
            height: 22px;
            border: none;
            background: transparent;
            color: #8b949e;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .tree-action-btn:hover { background: #30363d; color: #e6edf3; }
        .tree-folder-children {
            padding-left: 12px;
        }

        /* --- Tree file item --- */
        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 4px 8px 4px 12px;
            color: #c9d1d9;
            text-decoration: none;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            gap: 6px;
            position: relative;
        }
        @media (hover: hover) {
            .sidebar-item:hover { background: #21262d; }
        }
        .sidebar-item.active {
            background: #1f6feb22;
            color: #58a6ff;
        }
        .sidebar-item .doc-icon {
            font-size: 12px;
            color: #8b949e;
            flex-shrink: 0;
        }
        .sidebar-item .doc-title {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .sidebar-item .item-more {
            display: none;
            width: 20px;
            height: 20px;
            border: none;
            background: transparent;
            color: #8b949e;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
        }
        @media (hover: hover) {
            .sidebar-item:hover .item-more { display: flex; }
            .sidebar-item .item-more:hover { background: #30363d; color: #e6edf3; }
        }

        /* --- Context menu --- */
        .tree-context-menu {
            position: fixed;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 4px 0;
            min-width: 180px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 300;
            display: none;
        }
        .tree-context-menu.visible { display: block; }
        .ctx-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            font-size: 13px;
            color: #c9d1d9;
            cursor: pointer;
            white-space: nowrap;
        }
        .ctx-item:hover { background: #21262d; color: #e6edf3; }
        .ctx-item .ctx-icon { width: 16px; text-align: center; font-size: 13px; color: #8b949e; }
        .ctx-sep { height: 1px; background: #30363d; margin: 4px 0; }
        .ctx-item.ctx-danger { color: #f85149; }
        .ctx-item.ctx-danger:hover { background: rgba(248,81,73,0.15); }

        /* --- Sidebar bottom toolbar --- */
        .sidebar-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px 12px;
            border-top: 1px solid #30363d;
            flex-shrink: 0;
        }
        .sidebar-toolbar-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #8b949e;
            cursor: pointer;
            border-radius: 6px;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-toolbar-btn:hover { background: #21262d; color: #e6edf3; }
        .sidebar-toolbar-btn .toolbar-tip {
            display: none;
            position: absolute;
            bottom: 42px;
            background: #30363d;
            color: #e6edf3;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            pointer-events: none;
        }
        .sidebar-toolbar-btn:hover .toolbar-tip { display: block; }

        /* --- TOC (Table of Contents) --- */
        .toc-sidebar {
            position: fixed;
            top: 60px;
            width: 200px;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            padding: 8px 0;
            display: none;
            flex-direction: column;
            z-index: 50;
        }
        .toc-sidebar.visible { display: flex; }
        .toc-sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 12px 8px;
            flex-shrink: 0;
        }
        .toc-sidebar-title {
            font-size: 11px;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .toc-sidebar-toggle {
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .toc-sidebar-toggle:hover { background: #21262d; color: #e6edf3; }

        /* TOC expand button */
        .toc-expand-btn {
            position: fixed;
            top: 60px;
            width: 28px;
            height: 28px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #8b949e;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 50;
        }
        .toc-expand-btn:hover { background: #30363d; color: #e6edf3; }

        .toc-item {
            display: block;
            padding: 4px 12px;
            color: #8b949e;
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-left: 2px solid transparent;
        }
        .toc-item:hover {
            color: #e6edf3;
            background: #161b22;
        }
        .toc-item.active {
            color: #8957e5;
            border-left-color: #8957e5;
        }
        .toc-item.toc-h2 { padding-left: 12px; }
        .toc-item.toc-h3 { padding-left: 24px; font-size: 11px; }

        /* --- Main content area --- */
        .main {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

        /* --- Top bar --- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #0d1117ee;
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #30363d;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            min-height: 48px;
        }

        /* Breadcrumb row */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 0 0;
            font-size: 12px;
            color: #8b949e;
            min-height: 28px;
            overflow: hidden;
            white-space: nowrap;
            min-width: 0;
        }
        .breadcrumb a {
            color: #8b949e;
            text-decoration: none;
            cursor: pointer;
            flex-shrink: 0;
        }
        .breadcrumb a:hover { color: #58a6ff; }
        .breadcrumb .sep { color: #484f58; margin: 0 2px; flex-shrink: 0; }
        .breadcrumb .current { color: #e6edf3; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }

        /* Title + actions row */
        .topbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 4px 0 8px;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }
        .topbar-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .version-selector {
            background: #21262d;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .version-selector:hover { border-color: #8957e5; }
        .version-selector:focus { outline: none; border-color: #8957e5; }

        .topbar-btn {
            padding: 6px 12px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #e6edf3;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }
        .topbar-btn:hover { background: #30363d; }
        .topbar-btn.primary { background: #238636; border-color: #238636; }
        .topbar-btn.primary:hover { background: #2ea043; }
        .topbar-btn.copied { background: #1f6feb; border-color: #1f6feb; }

        /* --- Content --- */
        .content-wrapper {
            max-width: 880px;
            margin: 0 auto;
            padding: 24px 24px 120px;
            width: 100%;
        }
        .markdown-body {
            background-color: transparent;
            color: #e6edf3;
        }
        .markdown-body::selection, .markdown-body *::selection {
            background: rgba(137, 87, 229, 0.4);
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3,
        .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            color: #e6edf3;
            border-bottom-color: #30363d;
            scroll-margin-top: 60px;
        }
        .markdown-body a { color: #58a6ff; }
        .markdown-body code { background-color: #161b22; color: #e6edf3; }
        .markdown-body pre { background-color: #161b22; border: 1px solid #30363d; }
        .markdown-body table { display: block; overflow-x: auto; max-width: 100%; }
        .markdown-body table tr { background-color: #0d1117; border-top-color: #30363d; }
        .markdown-body table tr:nth-child(2n) { background-color: #161b22; }
        .markdown-body table th, .markdown-body table td { border-color: #30363d; white-space: nowrap; }
        .markdown-body blockquote { color: #8b949e; border-left-color: #30363d; }
        .markdown-body hr { background-color: #30363d; }

        .loading { text-align: center; color: #8b949e; padding: 50px; }
        .error { color: #f85149; padding: 20px; background: #161b22; border-radius: 6px; }

        /* Document updated banner */
        .doc-updated-banner {
            display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
            background: #1a3a2a; border-bottom: 1px solid #238636;
            padding: 10px 16px; text-align: center; font-size: 14px; color: #7ee787;
            cursor: pointer; transition: background 0.2s; font-weight: 500;
        }
        .doc-updated-banner:hover { background: #1f4a32; }

        /* --- Mobile toggle --- */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 200;
            background: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 16px;
        }

        /* --- TOC floating overlay mode for medium/narrow screens --- */
        .toc-sidebar.floating {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            max-height: 60vh;
            width: 220px;
        }

        /* TOC drawer mode (right-side slide-in) for narrow screens */
        .toc-sidebar.drawer {
            position: fixed;
            top: 0;
            right: 0;
            left: auto !important;
            width: 260px;
            height: 100vh;
            max-height: 100vh;
            background: #0d1117;
            border-left: 1px solid #30363d;
            border-radius: 0;
            box-shadow: -4px 0 16px rgba(0,0,0,0.4);
            transform: translateX(100%);
            transition: transform 0.25s ease;
            z-index: 151;
            padding-top: 8px;
        }
        .toc-sidebar.drawer.visible { transform: translateX(0); display: flex; }
        .toc-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 49;
        }
        .toc-backdrop.visible { display: block; }
        .toc-backdrop.drawer-backdrop { z-index: 150; background: rgba(0,0,0,0.5); }

        /* Topbar TOC button -- visible only at narrow widths */
        .topbar-toc-btn {
            display: none;
            background: none;
            border: 1px solid #30363d;
            color: #8b949e;
            cursor: pointer;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;
        }
        .topbar-toc-btn:hover { background: #21262d; color: #e6edf3; }

        /* --- Trash items --- */
        .trash-item { display: flex; align-items: center; padding: 4px 12px; }
        .trash-actions { margin-left: auto; display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
        .trash-item:hover .trash-actions { opacity: 1; }
        .trash-action-btn {
            background: none; border: 1px solid #30363d; color: #8b949e; cursor: pointer;
            border-radius: 4px; padding: 2px 6px; font-size: 12px;
        }
        .trash-action-btn:hover { background: #21262d; color: #e6edf3; }
        .trash-action-btn[data-trash-action="delete"]:hover { color: #f85149; border-color: #f85149; }

        /* --- Add file modal --- */
        .add-file-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000; display: none;
            justify-content: center; align-items: center;
        }
        .add-file-modal .modal-box {
            background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; width: 360px;
        }
        .add-file-modal h3 { margin: 0 0 16px; color: #e6edf3; }
        .add-file-modal label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 4px; }
        .add-file-modal input {
            width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d;
            border-radius: 6px; color: #e6edf3; font-size: 14px; margin-bottom: 12px; box-sizing: border-box;
        }
        .add-file-modal input:focus { outline: none; border-color: #8957e5; }
        .add-file-modal .modal-footer { display: flex; gap: 8px; justify-content: flex-end; }
        .add-file-modal button {
            padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
        }
        .add-file-modal .btn-cancel { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
        .add-file-modal .btn-cancel:hover { background: #30363d; }
        .add-file-modal .btn-create { background: #8957e5; color: #fff; }
        .add-file-modal .btn-create:hover { background: #a371f7; }
        .add-file-modal .modal-hint { font-size: 12px; color: #8b949e; margin-bottom: 12px; }

        /* --- Topbar more menu --- */
        .topbar-more-wrap { position: relative; }
        .topbar-more-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #e6edf3;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .topbar-more-btn:hover { background: #30363d; }
        .topbar-more-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 4px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 4px 0;
            min-width: 180px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 200;
            display: none;
        }
        .topbar-more-menu.visible { display: block; }
        .topbar-menu-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            font-size: 13px;
            color: #c9d1d9;
            cursor: pointer;
            white-space: nowrap;
        }
        .topbar-menu-item:hover { background: #21262d; color: #e6edf3; }
        .topbar-menu-item .menu-icon { width: 16px; text-align: center; font-size: 13px; color: #8b949e; }

        /* --- Drag & Drop --- */
        .sidebar-item.dragging { opacity: 0.4; }
        .tree-folder.dragging-folder > .tree-folder-header { opacity: 0.4; }
        .tree-folder.dragging-folder > .tree-folder-children { opacity: 0.4; }
        .tree-folder-header.drag-over {
            outline: 2px dashed #8957e5;
            outline-offset: -2px;
            background: rgba(137, 87, 229, 0.1) !important;
        }
        .tree-folder-header.drag-over-above { border-top: 2px solid #8957e5; margin-top: -2px; }
        .tree-folder-header.drag-over-below { border-bottom: 2px solid #8957e5; margin-bottom: -2px; }
        .sidebar-item.drag-over-above { border-top: 2px solid #8957e5; margin-top: -2px; }
        .sidebar-item.drag-over-below { border-bottom: 2px solid #8957e5; margin-bottom: -2px; }
        .sidebar-item.drag-over-into { background: rgba(137, 87, 229, 0.1) !important; }

        /* --- Batch mode --- */
        .batch-checkbox {
            display: none;
            width: 16px;
            height: 16px;
            accent-color: #8957e5;
            flex-shrink: 0;
            cursor: pointer;
        }
        .batch-mode .batch-checkbox { display: inline-block; }
        .batch-mode .sidebar-item { cursor: default; }
        .batch-mode .item-more { display: none !important; }
        .batch-toolbar {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-top: 1px solid #30363d;
            background: #161b22;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .batch-toolbar.visible { display: flex; }
        .batch-toolbar select {
            background: #21262d;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
        }
        .batch-toolbar button {
            padding: 4px 10px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #e6edf3;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .batch-toolbar button:hover { background: #30363d; }
        .batch-toolbar button.danger { color: #f85149; }
        .batch-toolbar .batch-count { font-size: 12px; color: #8b949e; }

        /* --- Responsive breakpoints --- */
        @media (max-width: 1100px) {
            .toc-sidebar { display: none; }
            .toc-sidebar.drawer { display: flex; }
            .toc-sidebar.visible.floating { display: flex; z-index: 51; }
            .toc-expand-btn { display: none !important; }
            .topbar-toc-btn { display: inline-flex; align-items: center; gap: 4px; }
        }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -280px; z-index: 150; transition: left 0.3s; width: 280px !important; height: 100vh; }
            .sidebar.open { left: 0; }
            .sidebar.collapsed { width: 280px !important; min-width: auto !important; border-right: 1px solid #30363d; }
            .sidebar.collapsed .sidebar-header,
            .sidebar.collapsed .sidebar-content,
            .sidebar.collapsed .sidebar-toolbar { display: flex; }
            .sidebar-collapse-btn { display: none !important; }
            .sidebar-resize { display: none !important; }
            .sidebar-toggle { display: block; }
            .mobile-backdrop { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 140; }
            .mobile-backdrop.visible { display: block; }
            .toc-sidebar { display: none; }
            .toc-sidebar.drawer { display: flex; }
            .toc-expand-btn { display: none !important; }
            .content-wrapper { padding: 24px 16px 80px; }
            .topbar { padding: 8px 12px; }
            .topbar-title { font-size: 13px; }
            .sidebar-toolbar { padding: 6px 8px; }
            /* On touch devices, always show action buttons */
            .tree-folder-header .tree-folder-actions { display: flex; }
            .tree-folder-header .tree-folder-count { display: none; }
            .sidebar-item .item-more { display: flex; }
        }
    </style>
</head>
<body>
    <!-- ============================================================
         HxA Viewer — HTML Structure
         ============================================================ -->

    <button class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
    <div class="mobile-backdrop" id="mobileBackdrop"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-resize" id="sidebarResize"></div>
        <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Toggle sidebar">&#9664;</button>
        <div class="sidebar-header">
            <a class="sidebar-brand" id="brandLink">HxA Viewer</a>
            <div class="sidebar-search">
                <input type="search" id="searchInput" placeholder="Search docs...">
            </div>
        </div>
        <div class="sidebar-content">
            <div class="sidebar-section" id="fileList">
                <div class="sidebar-section-title">Documents</div>
            </div>
        </div>
        <div class="batch-toolbar" id="batchToolbar">
            <span class="batch-count" id="batchCount">0 selected</span>
            <button id="batchSelectAll">Select All</button>
            <select id="batchMoveTarget"><option value="">Move to...</option></select>
            <button id="batchMove">Move</button>
            <button id="batchRemove" class="danger">Remove</button>
            <button id="batchCancel">Cancel</button>
        </div>
        <div class="sidebar-toolbar" id="sidebarToolbar">
            <button class="sidebar-toolbar-btn" id="tbSettings" title="Settings" aria-label="Settings">&#9881;</button>
            <button class="sidebar-toolbar-btn" id="tbRefresh" title="Refresh" aria-label="Refresh file list">&#8635;</button>
            <button class="sidebar-toolbar-btn" id="tbBatchMode" title="Batch" aria-label="Batch operations">&#9745;</button>
            <button class="sidebar-toolbar-btn" id="tbTrash" title="Trash" aria-label="Trash">&#128465;</button>
        </div>
    </aside>

    <!-- Context menu -->
    <div class="tree-context-menu" id="treeContextMenu">
        <div class="ctx-item" data-action="open-new-tab"><span class="ctx-icon">&#8599;</span>Open in new tab</div>
        <div class="ctx-item" data-action="copy-link"><span class="ctx-icon">&#128279;</span>Copy link</div>
        <div class="ctx-item" data-action="copy-md"><span class="ctx-icon">&#128203;</span>Copy Markdown</div>
        <div class="ctx-sep"></div>
        <div class="ctx-item" data-action="copy-title"><span class="ctx-icon">&#128203;</span>Copy title</div>
        <div class="ctx-item" data-action="rename"><span class="ctx-icon">&#9999;&#65039;</span>Rename</div>
        <div class="ctx-sep"></div>
        <div class="ctx-item ctx-danger" data-action="trash"><span class="ctx-icon">&#128465;&#65039;</span>Move to Trash</div>
    </div>

    <!-- Main -->
    <div class="main" id="mainArea">
        <!-- TOC inside content area -->
        <div class="toc-sidebar" id="tocSidebar">
            <div class="toc-sidebar-header">
                <span class="toc-sidebar-title" id="tocDocTitle"></span>
                <button class="toc-sidebar-toggle" id="tocSidebarToggle" title="Hide TOC">&laquo;</button>
            </div>
            <div id="tocList"></div>
        </div>
        <button class="toc-expand-btn" id="tocExpandBtn" title="Show TOC">&#9776;</button>
        <div class="toc-backdrop" id="tocBackdrop"></div>
        <div class="topbar" id="topbar" style="display:none;">
            <div class="breadcrumb" id="breadcrumb" style="display:none;"></div>
            <div class="topbar-row">
                <div class="topbar-left">
                    <span class="topbar-title" id="docTitle"></span>
                    <span id="docUpdatedAt" style="display:none;"></span>
                </div>
                <div class="topbar-right">
                    <select class="version-selector" id="versionSelector" style="display:none;">
                        <option value="">Current</option>
                    </select>
                    <button class="topbar-toc-btn" id="topbarTocBtn" title="Table of Contents">&#9776; TOC</button>
                    <div class="topbar-more-wrap">
                        <button class="topbar-more-btn" id="topbarMoreBtn" title="More" aria-label="More actions">&#8943;</button>
                        <div class="topbar-more-menu" id="topbarMoreMenu">
                            <div class="topbar-menu-item" id="menuCopyMd"><span class="menu-icon">&#128203;</span>Copy Markdown</div>
                            <div class="topbar-menu-item" id="menuCopyText"><span class="menu-icon">&#128196;</span>Copy plain text</div>
                            <div class="topbar-menu-item" id="menuOpenNew"><span class="menu-icon">&#8599;</span>Open in new tab</div>
                            <div class="topbar-menu-item" id="menuCopyLink"><span class="menu-icon">&#128279;</span>Copy link</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="doc-updated-banner" id="docUpdatedBanner" onclick="location.reload()">Document updated -- click to refresh</div>
        <div class="content-wrapper">
            <article class="markdown-body" id="content">
                <div class="loading">Select a document from the sidebar</div>
            </article>
        </div>
    </div>

    <!-- Add File Modal -->
    <div class="add-file-modal" id="addFileModal">
        <div class="modal-box">
            <h3>New Document</h3>
            <label>Document title</label>
            <input type="text" id="newFileTitle" placeholder="Enter document title">
            <label>File name</label>
            <input type="text" id="newFileName" placeholder="auto-generated.md">
            <div class="modal-hint" id="newFileFolderHint">Will be added to: ...</div>
            <div class="modal-footer">
                <button class="btn-cancel" id="addFileCancel">Cancel</button>
                <button class="btn-create" id="addFileCreate">Create</button>
            </div>
        </div>
    </div>

    <!-- Create Folder Modal -->
    <div class="add-file-modal" id="createFolderModal">
        <div class="modal-box">
            <h3>New Folder</h3>
            <label>Folder name</label>
            <input type="text" id="newFolderName" placeholder="Enter folder name">
            <label>Parent folder (optional)</label>
            <select id="newFolderParent" style="width:100%;padding:8px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;font-size:14px;margin-bottom:12px;">
                <option value="">Root</option>
            </select>
            <div class="modal-footer">
                <button class="btn-cancel" id="createFolderCancel">Cancel</button>
                <button class="btn-create" id="createFolderCreate">Create</button>
            </div>
        </div>
    </div>

    <!-- External dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <script>
    /* ============================================================
       HxA Viewer — JavaScript
       ============================================================ */

    // --- Markdown rendering setup ---
    marked.setOptions({
        highlight: function(code, lang) {
            if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
            return code;
        },
        breaks: true, gfm: true
    });

    // --- Configurable API base ---
    const API_BASE = window.HXA_VIEWER_API || '';

    // --- State ---
    let rawMarkdown = '';
    let currentDocId = '';
    let allDocs = [];

    // --- DOM references ---
    const contentEl = document.getElementById('content');
    const docTitle = document.getElementById('docTitle');
    const topbar = document.getElementById('topbar');
    const versionSelector = document.getElementById('versionSelector');
    const fileList = document.getElementById('fileList');
    const tocSidebar = document.getElementById('tocSidebar');
    const tocList = document.getElementById('tocList');
    const tocSidebarToggle = document.getElementById('tocSidebarToggle');
    const tocExpandBtn = document.getElementById('tocExpandBtn');
    const tocBackdrop = document.getElementById('tocBackdrop');
    const topbarTocBtn = document.getElementById('topbarTocBtn');
    const tocDocTitle = document.getElementById('tocDocTitle');
    const breadcrumb = document.getElementById('breadcrumb');
    const searchInput = document.getElementById('searchInput');
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const brandLink = document.getElementById('brandLink');
    const mainArea = document.getElementById('mainArea');

    // ================================================================
    // Mobile sidebar toggle
    // ================================================================
    const mobileBackdrop = document.getElementById('mobileBackdrop');
    function closeMobileSidebar() { sidebar.classList.remove('open'); mobileBackdrop.classList.remove('visible'); }
    sidebarToggle.addEventListener('click', () => {
        const opening = !sidebar.classList.contains('open');
        sidebar.classList.toggle('open');
        mobileBackdrop.classList.toggle('visible', opening);
    });
    mobileBackdrop.addEventListener('click', closeMobileSidebar);
    mainArea.addEventListener('click', () => { if (window.innerWidth <= 768) closeMobileSidebar(); });

    // ================================================================
    // Desktop sidebar collapse
    // ================================================================
    const sidebarCollapseBtn = document.getElementById('sidebarCollapseBtn');
    sidebarCollapseBtn.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        sidebarCollapseBtn.textContent = sidebar.classList.contains('collapsed') ? '\u25B6' : '\u25C0';
        localStorage.setItem('sidebar-collapsed', sidebar.classList.contains('collapsed'));
        setTimeout(updateTocPosition, 50);
    });
    // Restore sidebar state (desktop only)
    if (localStorage.getItem('sidebar-collapsed') === 'true' && window.innerWidth > 768) {
        sidebar.classList.add('collapsed');
        sidebarCollapseBtn.textContent = '\u25B6';
    }

    // ================================================================
    // Sidebar resize
    // ================================================================
    const sidebarResize = document.getElementById('sidebarResize');
    let sidebarResizing = false;
    sidebarResize.addEventListener('mousedown', e => {
        sidebarResizing = true;
        sidebarResize.classList.add('active');
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
        e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
        if (!sidebarResizing) return;
        const w = Math.max(180, Math.min(e.clientX, 500));
        sidebar.style.width = w + 'px';
        updateTocPosition();
    });
    document.addEventListener('mouseup', () => {
        if (sidebarResizing) {
            sidebarResizing = false;
            sidebarResize.classList.remove('active');
            document.body.style.userSelect = '';
            document.body.style.cursor = '';
            localStorage.setItem('sidebar-width', sidebar.offsetWidth);
            updateTocPosition();
        }
    });
    // Restore sidebar width
    const savedSidebarW = localStorage.getItem('sidebar-width');
    if (savedSidebarW) sidebar.style.width = savedSidebarW + 'px';

    // ================================================================
    // TOC toggle with responsive drawer mode
    // ================================================================
    let tocVisible = true;
    function isNarrowScreen() { return window.innerWidth <= 1100; }

    function updateTocPosition() {
        if (isNarrowScreen()) {
            tocSidebar.style.left = '';
            tocSidebar.classList.remove('floating');
            tocSidebar.classList.add('drawer');
            tocBackdrop.classList.add('drawer-backdrop');
        } else {
            const sidebarRect = sidebar.getBoundingClientRect();
            const left = sidebar.classList.contains('collapsed') ? 8 : sidebarRect.right + 8;
            tocSidebar.style.left = left + 'px';
            tocExpandBtn.style.left = left + 'px';
            tocSidebar.classList.remove('floating', 'drawer');
            tocBackdrop.classList.remove('visible', 'drawer-backdrop');
        }
    }

    function hideTOC() {
        tocSidebar.classList.remove('visible');
        tocVisible = false;
        tocBackdrop.classList.remove('visible');
        if (!isNarrowScreen()) {
            tocExpandBtn.style.display = 'flex';
            localStorage.setItem('toc-collapsed', 'true');
            mainArea.style.paddingLeft = '';
        }
        updateTocPosition();
    }

    function showTOC() {
        tocSidebar.classList.add('visible');
        tocVisible = true;
        if (isNarrowScreen()) {
            tocSidebar.classList.add('drawer');
            tocBackdrop.classList.add('visible', 'drawer-backdrop');
        } else {
            tocExpandBtn.style.display = 'none';
            localStorage.setItem('toc-collapsed', 'false');
            mainArea.style.paddingLeft = '216px';
        }
        updateTocPosition();
    }

    tocSidebarToggle.addEventListener('click', hideTOC);
    tocExpandBtn.addEventListener('click', showTOC);
    topbarTocBtn.addEventListener('click', () => { tocVisible ? hideTOC() : showTOC(); });
    tocBackdrop.addEventListener('click', hideTOC);

    // Close drawer TOC when clicking a TOC item on narrow screens
    tocList.addEventListener('click', (e) => {
        if (isNarrowScreen() && e.target.classList.contains('toc-item')) {
            setTimeout(hideTOC, 150);
        }
    });

    // Handle resize: switch between drawer and desktop modes
    window.addEventListener('resize', () => {
        updateTocPosition();
        if (!isNarrowScreen() && tocVisible) {
            tocBackdrop.classList.remove('visible', 'drawer-backdrop');
            tocSidebar.classList.remove('drawer');
            mainArea.style.paddingLeft = '216px';
        } else if (isNarrowScreen()) {
            mainArea.style.paddingLeft = '';
        }
    });

    // Restore TOC state
    if (localStorage.getItem('toc-collapsed') === 'true') {
        tocVisible = false;
    }

    // ================================================================
    // ESC key handler -- close modals, drawers, panels
    // ================================================================
    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        if (tocVisible && isNarrowScreen()) { hideTOC(); return; }
        const modals = ['addFileModal', 'createFolderModal'];
        for (const id of modals) {
            const m = document.getElementById(id);
            if (m && m.style.display === 'flex') { m.style.display = 'none'; return; }
        }
        const ctx = document.getElementById('treeContextMenu');
        if (ctx && ctx.style.display === 'block') { ctx.style.display = 'none'; return; }
        const mm = document.getElementById('topbarMoreMenu');
        if (mm && mm.classList.contains('visible')) { mm.classList.remove('visible'); return; }
    });

    // ================================================================
    // Brand link = go home
    // ================================================================
    brandLink.addEventListener('click', () => {
        window.history.pushState({}, '', window.location.pathname.replace(/\/[^/]*$/, '/'));
        currentDocId = '';
        contentEl.innerHTML = '<div class="loading">Select a document from the sidebar</div>';
        topbar.style.display = 'none';
        tocSidebar.classList.remove('visible');
        tocExpandBtn.style.display = 'none';
        document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    });

    // ================================================================
    // Tree config & file list
    // ================================================================
    let treeConfig = null;
    let docMap = {}; // path -> doc info

    async function loadFileList() {
        try {
            const [docsRes, treeRes] = await Promise.all([
                fetch(API_BASE + '/documents'),
                fetch('/tree-config.json?t=' + Date.now())
            ]);
            const data = await docsRes.json();
            allDocs = data.files || [];
            allDocs.forEach(d => docMap[d.path] = d);

            if (treeRes.ok) {
                treeConfig = await treeRes.json();
                renderTree(treeConfig);
            } else {
                renderFlatList(allDocs);
            }
        } catch (err) {
            console.error('Failed to load documents:', err);
        }
    }

    function renderTree(config) {
        const assignedFiles = new Set();
        let html = '<div class="sidebar-section-title">Table of contents</div>';

        function renderFolder(folder, depth) {
            const folderId = folder.id;
            const expanded = config.defaultExpanded?.includes(folderId) || localStorage.getItem('tree:' + folderId) === 'open';
            const savedState = localStorage.getItem('tree:' + folderId);
            const isCollapsed = savedState ? savedState === 'closed' : !expanded;

            let childHtml = '';
            let fileCount = 0;

            if (folder.children) {
                folder.children.forEach(child => {
                    const result = renderFolder(child, depth + 1);
                    childHtml += result.html;
                    fileCount += result.count;
                });
            }

            if (folder.files) {
                folder.files.forEach(filePath => {
                    const doc = docMap[filePath];
                    if (doc) {
                        assignedFiles.add(filePath);
                        fileCount++;
                        const active = filePath === currentDocId ? ' active' : '';
                        const displayTitle = (config.fileTitles && config.fileTitles[filePath]) || doc.title;
                        childHtml += `<a class="sidebar-item${active}" data-path="${filePath}" data-folder-id="${folderId}" draggable="true" title="${doc.title}"><input type="checkbox" class="batch-checkbox" data-path="${filePath}"><span class="doc-icon">&#128196;</span><span class="doc-title">${displayTitle}</span><button class="item-more" data-path="${filePath}">&ctdot;</button></a>`;
                    }
                });
            }

            const folderHtml = `<div class="tree-folder${isCollapsed ? ' collapsed' : ''}" data-folder-id="${folderId}">
                <div class="tree-folder-header" draggable="true" data-drag-folder-id="${folderId}">
                    <span class="tree-folder-arrow">&#9660;</span>
                    <span class="tree-folder-icon">&#128193;</span>
                    <span class="tree-folder-name">${folder.name}</span>
                    <span class="tree-folder-count">${fileCount}</span>
                    <span class="tree-folder-actions"><button class="tree-action-btn folder-more-btn" data-folder-id="${folderId}" data-folder-name="${folder.name}" title="More">&ctdot;</button></span>
                </div>
                <div class="tree-folder-children">${childHtml}</div>
            </div>`;

            return { html: folderHtml, count: fileCount };
        }

        config.folders.forEach(folder => {
            const result = renderFolder(folder, 0);
            html += result.html;
        });

        // Unassigned files
        const unassigned = allDocs.filter(d => !assignedFiles.has(d.path));
        if (unassigned.length) {
            html += '<div class="tree-folder" data-folder-id="_unassigned"><div class="tree-folder-header"><span class="tree-folder-arrow">&#9660;</span><span class="tree-folder-icon">&#128193;</span><span class="tree-folder-name">Uncategorized</span><span class="tree-folder-count">' + unassigned.length + '</span></div><div class="tree-folder-children">';
            unassigned.forEach(d => {
                const active = d.path === currentDocId ? ' active' : '';
                const uDisplayTitle = (config.fileTitles && config.fileTitles[d.path]) || d.title;
                html += `<a class="sidebar-item${active}" data-path="${d.path}" data-folder-id="_unassigned" draggable="true" title="${d.title}"><input type="checkbox" class="batch-checkbox" data-path="${d.path}"><span class="doc-icon">&#128196;</span><span class="doc-title">${uDisplayTitle}</span><button class="item-more" data-path="${d.path}">&ctdot;</button></a>`;
            });
            html += '</div></div>';
        }

        // Trash section
        if (treeConfig && treeConfig.trash && treeConfig.trash.length > 0) {
            const trashCollapsed = localStorage.getItem('tree:_trash') !== 'open';
            html += `<div class="tree-folder${trashCollapsed ? ' collapsed' : ''}" data-folder-id="_trash">
                <div class="tree-folder-header">
                    <span class="tree-folder-arrow">&#9660;</span>
                    <span class="tree-folder-icon">&#128465;&#65039;</span>
                    <span class="tree-folder-name">Trash</span>
                    <span class="tree-folder-count">${treeConfig.trash.length}</span>
                </div>
                <div class="tree-folder-children">`;
            treeConfig.trash.forEach(item => {
                const days = Math.floor((Date.now() - new Date(item.deletedAt).getTime()) / 86400000);
                const daysLeft = 30 - days;
                html += `<div class="sidebar-item trash-item" data-trash-path="${item.path}" title="${item.title} (${daysLeft > 0 ? daysLeft + ' days until auto-delete' : 'pending cleanup'})">
                    <span class="doc-icon" style="opacity:0.5;">&#128196;</span>
                    <span class="doc-title" style="opacity:0.6; text-decoration:line-through;">${item.title}</span>
                    <span class="trash-actions">
                        <button class="trash-action-btn" data-trash-action="restore" data-trash-path="${item.path}" title="Restore">&#8617;</button>
                        <button class="trash-action-btn" data-trash-action="delete" data-trash-path="${item.path}" title="Permanently delete">&#10005;</button>
                    </span>
                </div>`;
            });
            html += '</div></div>';
        }

        fileList.innerHTML = html;
        bindTreeEvents();
    }

    function renderFlatList(docs) {
        let html = '<div class="sidebar-section-title">Documents</div>';
        docs.forEach(d => {
            const active = d.path === currentDocId ? ' active' : '';
            html += `<a class="sidebar-item${active}" data-path="${d.path}" title="${d.title}"><span class="doc-icon">&#128196;</span><span class="doc-title">${d.title}</span><button class="item-more" data-path="${d.path}">&ctdot;</button></a>`;
        });
        fileList.innerHTML = html;
        bindTreeEvents();
    }

    // ================================================================
    // Context menu
    // ================================================================
    const treeContextMenu = document.getElementById('treeContextMenu');
    let contextMenuTarget = null;

    function showContextMenu(x, y, filePath) {
        contextMenuTarget = filePath;
        treeContextMenu.style.left = x + 'px';
        treeContextMenu.style.top = y + 'px';
        treeContextMenu.classList.add('visible');
        const rect = treeContextMenu.getBoundingClientRect();
        if (rect.right > window.innerWidth) treeContextMenu.style.left = (window.innerWidth - rect.width - 8) + 'px';
        if (rect.bottom > window.innerHeight) treeContextMenu.style.top = (window.innerHeight - rect.height - 8) + 'px';
    }

    function hideContextMenu() {
        treeContextMenu.classList.remove('visible');
        contextMenuTarget = null;
    }

    document.addEventListener('click', (e) => { if (!treeContextMenu.contains(e.target)) hideContextMenu(); });
    document.addEventListener('contextmenu', (e) => { if (!treeContextMenu.contains(e.target)) hideContextMenu(); });

    // Context menu actions
    treeContextMenu.querySelectorAll('.ctx-item').forEach(item => {
        item.addEventListener('click', async () => {
            const action = item.dataset.action;
            const path = contextMenuTarget;
            if (!path) { hideContextMenu(); return; }
            const doc = docMap[path];
            const url = window.location.origin + '/' + path;

            switch (action) {
                case 'open-new-tab':
                    window.open(url, '_blank');
                    break;
                case 'copy-link':
                    await copyText(url);
                    showToast('Link copied');
                    break;
                case 'copy-md':
                    try {
                        const res = await fetch('/raw/' + path);
                        if (res.ok) { await copyText(await res.text()); showToast('Markdown copied'); }
                    } catch {}
                    break;
                case 'copy-title':
                    await copyText(doc?.title || path);
                    showToast('Title copied');
                    break;
                case 'rename':
                    const currentTitle = (treeConfig.fileTitles && treeConfig.fileTitles[path]) || doc?.title || path;
                    const newTitle = prompt('Rename display title:', currentTitle);
                    if (newTitle && newTitle !== currentTitle) {
                        if (!treeConfig.fileTitles) treeConfig.fileTitles = {};
                        treeConfig.fileTitles[path] = newTitle;
                        treeConfig.version = (treeConfig.version || 0) + 1;
                        try {
                            const res = await fetch(API_BASE + '/tree-config', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ config: treeConfig, user: 'anonymous' })
                            });
                            if (res.ok) { showToast('Renamed'); renderTree(treeConfig); }
                            else { showToast('Rename failed', 'error'); }
                        } catch { showToast('Rename failed', 'error'); }
                    }
                    break;
                case 'trash':
                    if (confirm('Move this document to Trash?')) {
                        try {
                            const res = await fetch(API_BASE + '/trash-file', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ filePath: path, user: 'anonymous' })
                            });
                            if (res.ok) { showToast('Moved to trash'); loadFileList(); }
                            else { showToast('Operation failed', 'error'); }
                        } catch { showToast('Operation failed', 'error'); }
                    }
                    break;
            }
            hideContextMenu();
        });
    });

    // ================================================================
    // Utility functions
    // ================================================================
    async function copyText(text) {
        try { await navigator.clipboard.writeText(text); } catch {
            const ta = document.createElement('textarea'); ta.value = text;
            document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        }
    }

    function showToast(msg, type) {
        let toast = document.getElementById('ctxToast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'ctxToast';
            toast.style.cssText = 'position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;';
            document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.background = type === 'error' ? '#da3633' : '#238636';
        toast.style.opacity = '1';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, type === 'error' ? 3000 : 1800);
    }

    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

    function formatTime(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        const now = new Date();
        if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }

        // --- Drag & Drop with reorder support ---
        function clearDropIndicators() {
            fileList.querySelectorAll('.drag-over, .drag-over-above, .drag-over-below, .drag-over-into').forEach(el => {
                el.classList.remove('drag-over', 'drag-over-above', 'drag-over-below', 'drag-over-into');
            });
        }

        // File items: draggable + drop targets for reorder
        fileList.querySelectorAll('.sidebar-item[draggable]').forEach(item => {
            item.addEventListener('dragstart', (e) => {
                item.classList.add('dragging');
                e.dataTransfer.setData('text/plain', item.dataset.path);
                e.dataTransfer.setData('application/x-folder-id', item.dataset.folderId || '');
                e.dataTransfer.setData('application/x-drag-type', 'file');
                e.dataTransfer.effectAllowed = 'move';
            });
            item.addEventListener('dragend', () => { item.classList.remove('dragging'); clearDropIndicators(); });
            item.addEventListener('dragover', (e) => {
                e.preventDefault(); e.stopPropagation();
                e.dataTransfer.dropEffect = 'move';
                clearDropIndicators();
                const rect = item.getBoundingClientRect();
                const y = e.clientY - rect.top;
                item.classList.add(y < rect.height / 2 ? 'drag-over-above' : 'drag-over-below');
            });
            item.addEventListener('dragleave', () => { item.classList.remove('drag-over-above', 'drag-over-below'); });
            item.addEventListener('drop', (e) => {
                e.preventDefault(); e.stopPropagation();
                const rect = item.getBoundingClientRect();
                const y = e.clientY - rect.top;
                const position = y < rect.height / 2 ? 'before' : 'after';
                clearDropIndicators();
                const dragType = e.dataTransfer.getData('application/x-drag-type');
                const targetPath = item.dataset.path;
                const targetFolderId = item.dataset.folderId;
                if (dragType === 'file') {
                    const dragPath = e.dataTransfer.getData('text/plain');
                    const sourceFolderId = e.dataTransfer.getData('application/x-folder-id');
                    if (dragPath === targetPath) return;
                    reorderFileInTree(dragPath, sourceFolderId, targetFolderId, targetPath, position);
                } else if (dragType === 'folder') {
                    const dragFolderId = e.dataTransfer.getData('application/x-drag-folder-id');
                    if (dragFolderId && dragFolderId !== targetFolderId) {
                        moveFolderInTree(dragFolderId, targetFolderId);
                    }
                }
            });
        });

        // Folder headers: draggable + drop targets
        fileList.querySelectorAll('.tree-folder-header[draggable]').forEach(header => {
            header.addEventListener('dragstart', (e) => {
                e.stopPropagation();
                const folder = header.closest('.tree-folder');
                folder.classList.add('dragging-folder');
                e.dataTransfer.setData('application/x-drag-folder-id', header.dataset.dragFolderId);
                e.dataTransfer.setData('application/x-drag-type', 'folder');
                e.dataTransfer.effectAllowed = 'move';
            });
            header.addEventListener('dragend', () => {
                header.closest('.tree-folder').classList.remove('dragging-folder');
                clearDropIndicators();
            });
        });

        // All folder headers: drop targets with zone detection
        fileList.querySelectorAll('.tree-folder-header').forEach(header => {
            header.addEventListener('dragover', (e) => {
                e.preventDefault(); e.stopPropagation();
                e.dataTransfer.dropEffect = 'move';
                clearDropIndicators();
                const dragType = e.dataTransfer.types.includes('application/x-drag-folder-id') ? 'folder' : 'file';
                const rect = header.getBoundingClientRect();
                const y = e.clientY - rect.top;
                const zone = rect.height / 3;
                if (dragType === 'folder') {
                    if (y < zone) header.classList.add('drag-over-above');
                    else if (y > zone * 2) header.classList.add('drag-over-below');
                    else header.classList.add('drag-over');
                } else {
                    header.classList.add('drag-over');
                }
            });
            header.addEventListener('dragleave', () => { header.classList.remove('drag-over', 'drag-over-above', 'drag-over-below'); });
            header.addEventListener('drop', (e) => {
                e.preventDefault(); e.stopPropagation();
                const rect = header.getBoundingClientRect();
                const y = e.clientY - rect.top;
                const zone = rect.height / 3;
                const targetFolderId = header.closest('.tree-folder').dataset.folderId;
                const dragType = e.dataTransfer.getData('application/x-drag-type');
                clearDropIndicators();
                if (dragType === 'folder') {
                    const dragFolderId = e.dataTransfer.getData('application/x-drag-folder-id');
                    if (!dragFolderId || dragFolderId === targetFolderId) return;
                    if (y < zone) reorderFolderInTree(dragFolderId, targetFolderId, 'before');
                    else if (y > zone * 2) reorderFolderInTree(dragFolderId, targetFolderId, 'after');
                    else moveFolderInTree(dragFolderId, targetFolderId);
                } else {
                    const filePath = e.dataTransfer.getData('text/plain');
                    const sourceFolderId = e.dataTransfer.getData('application/x-folder-id');
                    if (filePath && sourceFolderId !== targetFolderId) {
                        moveFileInTree(filePath, sourceFolderId, targetFolderId);

                    }
                }
            });
        });
    }

    // ================================================================
    // Build TOC
    // ================================================================
    function buildTOC() {
        const headings = contentEl.querySelectorAll('h1, h2, h3');
        if (headings.length < 2) {
            tocSidebar.classList.remove('visible');
            tocExpandBtn.style.display = 'none';
            return;
        }
        const firstH1 = contentEl.querySelector('h1');
        tocDocTitle.textContent = firstH1 ? firstH1.textContent.substring(0, 20) : '';
        if (isNarrowScreen() || localStorage.getItem('toc-collapsed') === 'true') {
            hideTOC();
        } else {
            showTOC();
        }

        let html = '';
        headings.forEach((h, i) => {
            const id = 'heading-' + i;
            h.id = id;
            const level = h.tagName.toLowerCase();
            const text = h.textContent;
            html += `<a class="toc-item toc-${level}" data-target="${id}">${text}</a>`;
        });
        tocList.innerHTML = html;

        tocList.querySelectorAll('.toc-item').forEach(item => {
            item.addEventListener('click', () => {
                const target = document.getElementById(item.dataset.target);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });

        // Scroll spy
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    tocList.querySelectorAll('.toc-item').forEach(t => t.classList.remove('active'));
                    const active = tocList.querySelector(`[data-target="${entry.target.id}"]`);
                    if (active) active.classList.add('active');
                }
            });
        }, { rootMargin: '-60px 0px -80% 0px' });
        headings.forEach(h => observer.observe(h));
    }

    // ================================================================
    // Build breadcrumb
    // ================================================================
    function buildBreadcrumb(docPath) {
        if (!docPath) { breadcrumb.style.display = 'none'; return; }

        function findFolderChain(folders, target, chain) {
            for (const folder of folders) {
                const newChain = [...chain, folder];
                if (folder.files && folder.files.includes(target)) return newChain;
                if (folder.children) {
                    const result = findFolderChain(folder.children, target, newChain);
                    if (result) return result;
                }
            }
            return null;
        }

        const folderChain = treeConfig ? findFolderChain(treeConfig.folders, docPath, []) : null;
        const doc = docMap[docPath];
        const title = doc?.title || docPath.replace(/\.md$/, '');

        let html = '<a onclick="brandLink.click()">HxA Viewer</a>';
        if (folderChain) {
            folderChain.forEach(folder => {
                html += '<span class="sep">&#8250;</span>';
                html += `<a data-bc-folder="${folder.id}">${folder.name}</a>`;
            });
        }
        html += '<span class="sep">&#8250;</span>';
        html += `<span class="current">${title}</span>`;
        breadcrumb.innerHTML = html;
        breadcrumb.style.display = 'flex';

        breadcrumb.querySelectorAll('a[data-bc-folder]').forEach(a => {
            a.addEventListener('click', () => {
                const fid = a.dataset.bcFolder;
                const folder = fileList.querySelector(`.tree-folder[data-folder-id="${fid}"]`);
                if (folder) {
                    folder.classList.remove('collapsed');
                    localStorage.setItem('tree:' + fid, 'open');
                    folder.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    const hdr = folder.querySelector('.tree-folder-header');
                    hdr.style.background = '#8957e522';
                    setTimeout(() => { hdr.style.background = ''; }, 1500);
                }
            });
        });
    }

    // ================================================================
    // Extract version from markdown content
    // ================================================================
    function extractVersion(markdown) {
        const match = markdown.match(/版本[：:]\s*v?([\d.]+)/i) || markdown.match(/[Vv]([\d.]+)\s*\|/);
        return match ? match[1] : null;
    }

    // ================================================================
    // Load document
    // ================================================================
    const docUpdatedAt = document.getElementById('docUpdatedAt');

    async function loadDocument(commitHash, restoreScroll) {
        try {
            let url = commitHash
                ? API_BASE + '/version-content?doc=' + encodeURIComponent(currentDocId) + '&hash=' + encodeURIComponent(commitHash)
                : '/raw/' + currentDocId;

            const response = await fetch(url);
            if (!response.ok) throw new Error('File not found: ' + currentDocId);
            const markdown = await response.text();

            rawMarkdown = markdown;
            contentEl.innerHTML = DOMPurify.sanitize(marked.parse(markdown));
            document.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));

            const version = extractVersion(markdown);
            const titleMatch = markdown.match(/^#\s+(.+)/m);
            docTitle.textContent = (titleMatch ? titleMatch[1] : currentDocId) + (version ? ' v' + version : '');
            document.title = docTitle.textContent + ' - HxA Viewer';

            // Show update timestamp and meta info
            const dateMatch = markdown.match(/更新时间[：:]\s*(.+)/i) || markdown.match(/更新[：:]\s*([\d-]+)/i);
            const sourceMatch = markdown.match(/来源[：:]\s*(.+)/i);
            const maintainerMatch = markdown.match(/维护[：:]\s*(.+)/i) || markdown.match(/作者[：:]\s*(.+)/i);
            const versionMatch = markdown.match(/版本[：:]\s*(.+)/i);
            let metaParts = [];
            if (versionMatch) metaParts.push(versionMatch[1].trim());
            if (dateMatch) metaParts.push(dateMatch[1].trim());
            if (sourceMatch) metaParts.push(sourceMatch[1].trim());
            if (maintainerMatch) metaParts.push(maintainerMatch[1].trim());
            docUpdatedAt.textContent = metaParts.length ? metaParts.join('  \u00B7  ') : '';

            topbar.style.display = 'flex';

            buildTOC();
            buildBreadcrumb(currentDocId);
            interceptInternalLinks();
            document.getElementById('docUpdatedBanner').style.display = 'none';
            startDocMtimePolling();

            if (restoreScroll) {
                restoreScrollPosition(currentDocId);
            } else {
                mainArea.scrollTop = 0;
            }
        } catch (error) {
            contentEl.innerHTML = '<div class="error">' + error.message + '</div>';
        }
    }

    // ================================================================
    // Intercept internal .md links for SPA navigation
    // ================================================================
    function interceptInternalLinks() {
        contentEl.querySelectorAll('a[href]').forEach(a => {
            const href = a.getAttribute('href');
            if (!href) return;
            try {
                const url = new URL(href, window.location.origin);
                if (url.origin === window.location.origin && url.pathname.endsWith('.md')) {
                    a.addEventListener('click', e => {
                        e.preventDefault();
                        const path = url.pathname.startsWith('/') ? url.pathname.substring(1) : url.pathname;
                        navigateTo(path);
                    });
                }
            } catch {}
        });
    }

    // ================================================================
    // Load versions
    // ================================================================
    async function loadVersions() {
        if (!currentDocId) return;
        try {
            const response = await fetch(API_BASE + '/versions?doc=' + encodeURIComponent(currentDocId));
            if (response.ok) {
                const versions = await response.json();
                if (versions.length > 1) {
                    versionSelector.innerHTML = '';
                    versions.forEach(v => {
                        const opt = document.createElement('option');
                        opt.value = v.commitHash || '';
                        opt.textContent = 'v' + v.version + ' (' + v.date + ')' + (v.isCurrent ? ' \u2605' : '');
                        if (v.isCurrent) opt.selected = true;
                        versionSelector.appendChild(opt);
                    });
                    versionSelector.style.display = 'inline-block';
                } else {
                    versionSelector.style.display = 'none';
                }
            }
        } catch (err) { console.error('Failed to load versions:', err); }
    }

    versionSelector.addEventListener('change', e => loadDocument(e.target.value || null));

    // ================================================================
    // Document mtime polling -- show banner when file changes
    // ================================================================
    let docMtimeKnown = null;
    let docMtimeInterval = null;

    function startDocMtimePolling() {
        stopDocMtimePolling();
        if (!currentDocId) return;
        fetch(API_BASE + '/doc-mtime?doc=' + encodeURIComponent(currentDocId))
            .then(r => r.json()).then(d => { docMtimeKnown = d.mtime; }).catch(() => {});
        docMtimeInterval = setInterval(async () => {
            if (!currentDocId || !docMtimeKnown) return;
            try {
                const r = await fetch(API_BASE + '/doc-mtime?doc=' + encodeURIComponent(currentDocId));
                const d = await r.json();
                if (d.mtime && d.mtime > docMtimeKnown) {
                    document.getElementById('docUpdatedBanner').style.display = 'block';
                    stopDocMtimePolling();
                }
            } catch {}
        }, 5000);
    }

    function stopDocMtimePolling() {
        if (docMtimeInterval) { clearInterval(docMtimeInterval); docMtimeInterval = null; }
    }
